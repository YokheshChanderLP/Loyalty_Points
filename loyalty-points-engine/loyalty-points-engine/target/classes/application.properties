spring.application.name=loyalty-points-engine
server.port=8080

# ---- MySQL (change username/password to match your MySQL server) ----
spring.datasource.url=jdbc:mysql://localhost:3306/loyaltyDB
spring.datasource.username=root
spring.datasource.password=Mysql@9657.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate: tables are created/updated automatically ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- Loyalty rules (configurable) ----
# Points awarded per rupee actually paid (0.1 = 1 point for every Rs.10 paid)
app.loyalty.points-per-rupee=0.1
# Rupee value of one point when redeemed (1 = 1 point is worth Rs.1)
app.loyalty.redemption-value-per-point=1
